<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBook - Class Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-slate-900 text-white px-8 py-5 shadow-md">
        <h1 class="text-2xl font-bold tracking-tight">FitBook</h1>
        <p class="text-slate-400 text-sm">Book your next class</p>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <h2 class="text-xl font-semibold text-slate-800 mb-6">Upcoming Classes</h2>

        <div class="grid gap-5">
            {% for c in classes %}
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex justify-between items-center hover:shadow-md transition">
                <div>
                    <h3 class="text-lg font-semibold text-slate-900">{{ c.name }}</h3>
                    <p class="text-slate-500 text-sm mt-1">with {{ c.instructor }}</p>
                   <p class="text-slate-400 text-sm">{{ c.class_time }}</p>
<p class="text-slate-500 text-xs mt-1">{{ c.booked_count }} / {{ c.capacity }} booked</p>
                </div>

               {% if c.booked_count < c.capacity %}
<form action="/book/{{ c.id }}" method="POST" class="flex flex-col gap-2 w-56">
    <input type="text" name="name" placeholder="Your name" required
        class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
    <input type="email" name="email" placeholder="Your email" required
        class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
    <button type="submit"
        class="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-slate-700 transition">
        Book Class
    </button>
</form>
{% else %}
<span class="text-sm text-red-500 font-medium w-56 text-center">Class Full</span>
{% endif %}
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
