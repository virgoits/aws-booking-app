<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Full - FitBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-md border border-slate-200 p-10 max-w-md w-full text-center">
        <div class="text-5xl mb-4">😕</div>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">This class is full</h1>
        <p class="text-slate-500 mb-6">Sorry, all spots for this class have been booked. Try another time slot.</p>

        <a href="/" class="inline-block bg-slate-900 text-white rounded-lg px-6 py-2 text-sm font-medium hover:bg-slate-700 transition">
            Browse Other Classes
        </a>
    </div>
</body>
</html>
