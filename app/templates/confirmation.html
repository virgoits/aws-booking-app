{% extends "base.html" %}
{% block title %}Booking Confirmed - Lumina Wellness{% endblock %}
{% block content %}

<section class="min-h-[70vh] flex items-center justify-center py-24 bg-stone-50">
  <div class="max-w-md w-full mx-4 bg-white border border-stone-200 rounded-sm p-12 text-center">
    <i class="w-12 h-12 mx-auto mb-6 text-stone-800" data-lucide="check-circle"></i>
    <h1 class="font-serif text-3xl text-stone-900 mb-2">You're Booked, {{ name }}</h1>
    <p class="text-stone-500 mb-8 font-light">A confirmation for {{ booked_class.name }}</p>

    <div class="bg-stone-50 border border-stone-200 rounded-sm p-6 text-left mb-8">
      <p class="text-xs uppercase tracking-wide text-stone-400 mb-1">Instructor</p>
      <p class="text-stone-900 mb-4">{{ booked_class.instructor }}</p>
      <p class="text-xs uppercase tracking-wide text-stone-400 mb-1">Time</p>
      <p class="text-stone-900">{{ booked_class.class_time }}</p>
    </div>

    <a href="{{ url_for('booking') }}" class="inline-block bg-stone-900 text-white px-8 py-3 text-xs uppercase tracking-widest hover:bg-stone-800 transition-colors rounded-sm">
      Back to Classes
    </a>
  </div>
</section>

{% endblock %}
